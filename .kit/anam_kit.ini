; anam Kit adapter — local manifest (read-only, comments preserved)
[adapter]
enabled = true
endpoint = tcp://127.0.0.1:20129   ; TCP transport for this project
token = anam-local-2026            ; matches [daemon] token in anam.ini
session_id = kit-cli-cppIsekai     ; stable headless identity
project_id =                       ; empty = derive from cwd

[window]
window =                           ; empty = follow Kit's context limit
reserve = 4096

[log]
level = debug
file = ./anam-adapter.log

[tools]
send_schemas = true

[prompt]
; injected every turn as <project-instructions>; edit freely, picked up next turn
rules = Selalu gunakan codebase-memory-mcp (search_graph, trace_path, get_code_snippet, query_graph) sebagai alat pertama untuk explore code cppIsekai sebelum grep atau baca manual.
