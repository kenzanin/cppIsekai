<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>cppIsekai</title>
  <script src="/static/tailwind.min.js"></script>
  <script src="/static/htmx.min.js"></script>
  <script defer src="/static/alpine.min.js"></script>
  <style>
    /* per-manga dim+blur: toggling host/dim/<plugin>/<slug> marks this page's cover */
    img.cover-dim { filter: brightness(0.35) blur(6px); }
    .dim-toggle { font-size: 11px; }
  </style>
  <script>
    // Cover imgs carry &plugin=<p>&slug=<s>. Parse once, dim the pair, label toggles.
    const coverKey = function (img) {
      try {
        const u = new URL(img.src, location.origin);
        if (u.searchParams.get('cover') !== '1') return null;
        const plugin = u.searchParams.get('plugin');
        const slug = u.searchParams.get('slug');
        return plugin && slug ? plugin + '/' + slug : null;
      } catch (e) { return null; }
    };
    const dimSet = new Set();
    const paintDim = function () {
      document.querySelectorAll('img[src*="cover=1"]').forEach(img => {
        const k = coverKey(img);
        img.classList.toggle('cover-dim', !!k && dimSet.has(k));
      });
      document.querySelectorAll('[data-dim-toggle]').forEach(b => {
        const k = b.dataset.dimToggle;
        const on = !!k && dimSet.has(k);
        b.textContent = on ? 'Show cover' : 'Dim + blur cover';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    };
    const loadDim = async function () {
      try {
        const r = await fetch('/api/display/dim-list');
        if (!r.ok) return;
        const j = await r.json();
        (j.data || []).forEach(([p, s]) => dimSet.add(p + '/' + s));
        paintDim();
      } catch (e) { /* leave covers alone */ }
    };
    window.paintDim = paintDim; // detail page renders its cover async; it repaints after load()
    // Toggle one manga (from detail button) or a pair passed explicitly.
    window.toggleDimBlur = async function (plugin, slug) {
      plugin = plugin || (window.__dimPair && window.__dimPair[0]);
      slug = slug || (window.__dimPair && window.__dimPair[1]);
      if (!plugin || !slug) return;
      const k = plugin + '/' + slug;
      const on = !dimSet.has(k);
      try {
        const r = await fetch('/api/display/dim-blur', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ plugin, slug, on }) });
        if (!r.ok) return;
        if (on) dimSet.add(k); else dimSet.delete(k);
        paintDim();
      } catch (e) { /* leave UI unchanged */ }
    };
    document.addEventListener('DOMContentLoaded', loadDim);
    window.addEventListener('htmx:afterSwap', paintDim); // grid reloads via htmx keep their dim
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <header class="flex items-center gap-1 border-b border-zinc-800 px-4 h-12">
    <a href="/" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Library</a>
    <a href="/search" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Search</a>
    <a href="/plugins" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors bg-zinc-800">Plugins</a>
    <a href="/settings" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Settings</a>
    <span class="flex-1"></span>
    <a href="/logs" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Logs</a>
    <a href="/about" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">About</a>
  </header>
  <main class="p-4">
<div x-data="pluginsPage" x-init="load()">
  <div class="flex items-center gap-3 mb-4">
    <input x-model="q" placeholder="Filter name / capability"
           class="focus:outline-none focus:ring-2 focus:ring-zinc-500 focus:border-transparent transition bg-zinc-900 border border-zinc-700 rounded px-3 py-1.5 text-sm w-72">
    <button @click="reload()" class="px-3 py-1.5 text-sm bg-zinc-800 rounded hover:bg-zinc-700">Reload all</button>
    <span class="text-sm text-zinc-500" x-show="busy">…</span>
  </div>

  <!-- empty state -->
  <div x-show="view.length===0 && enrichView.length===0 && !busy" class="text-zinc-500 text-sm space-y-1 border border-dashed border-zinc-800 rounded p-6">
    <p>No plugins installed.</p>
    <p class="text-zinc-600">Drop a plugin folder into <code>data/plugins/&lt;id&gt;/</code>
      (needs <code>main.json</code> + entry script) and press Reload all. Dev copies live in
      <code>plugins_dev/&lt;lang&gt;/&lt;site&gt;/</code>, symlinked into data/plugins.</p>
  </div>

  <h2 class="text-lg font-semibold mb-2" x-show="enrichView.length" x-cloak>Enrichment</h2>
  <ul class="space-y-2 mb-6" x-show="enrichView.length" x-cloak>
    <template x-for="r in enrichView" :key="r.key || r.id">
      <li class="flex items-center gap-3 border border-zinc-800 rounded p-3"
          :class="r.enabled ? '' : 'opacity-50'">
        <!-- logo or initial -->
        <span class="w-9 h-9 rounded bg-zinc-800 flex items-center justify-center font-bold shrink-0"
              x-show="!broken[r.key || r.id] && r.key" >
          <img :src="'/plugin/'+r.key+'/logo'" class="w-9 h-9 rounded object-cover" @error="broken[r.key || r.id]=true" alt="">
        </span>
        <span class="w-9 h-9 rounded bg-zinc-800 flex items-center justify-center font-bold shrink-0"
              x-show="broken[r.key || r.id] || !r.key" x-text="r.name.charAt(0)"></span>

        <!-- name version runtime caps -->
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-medium truncate" x-text="r.name"></span>
            <a :href="r.website" x-show="r.website" target="_blank" rel="noopener" class="text-xs text-zinc-500 hover:text-emerald-300 shrink-0" title="plugin website">↗</a>
            <span class="text-xs text-zinc-500" x-text="r.version"></span>
            <span class="text-[10px] uppercase tracking-wide bg-zinc-800 rounded px-1.5 py-0.5"
                  x-show="r.runtime" x-text="r.runtime"></span>
          </div>
          <div class="flex gap-1 mt-1">
            <template x-for="c in caps(r)" :key="c">
              <span class="text-[10px] bg-zinc-900 border border-zinc-800 rounded px-1.5 py-0.5 text-zinc-400"
                    x-text="c"></span>
            </template>
          </div>
          <p class="text-xs text-red-400 mt-1" x-show="r.state==='error'"
             x-text="'last error: '+r.error"></p>
        </div>

        <span class="flex-1"></span>

        <!-- status -->
        <span class="text-xs shrink-0"
              :class="stateClass(r)" x-text="stateText(r)"></span>

        <!-- actions: enrichment sources are metadata-only, not toggleable -->
        <button @click="toggle(r)" x-show="!r.enrichment"
                class="px-3 py-1 text-xs rounded bg-zinc-800 hover:bg-zinc-700"
                x-text="r.enabled ? 'Disable' : 'Enable'"></button>
        <button @click="reload()" title="Rescan plugin dir"
                class="px-2 py-1 text-xs rounded bg-zinc-800 hover:bg-zinc-700">⟳</button>
      </li>
    </template>
  </ul>

  <h2 class="text-lg font-semibold mb-2" x-show="view.length">Manga plugins</h2>
  <ul class="space-y-2">
    <template x-for="r in view" :key="r.key || r.id">
      <li class="flex items-center gap-3 border border-zinc-800 rounded p-3"
          :class="r.enabled ? '' : 'opacity-50'">
        <!-- logo or initial -->
        <span class="w-9 h-9 rounded bg-zinc-800 flex items-center justify-center font-bold shrink-0"
              x-show="!broken[r.key || r.id] && r.key" >
          <img :src="'/plugin/'+r.key+'/logo'" class="w-9 h-9 rounded object-cover" @error="broken[r.key || r.id]=true" alt="">
        </span>
        <span class="w-9 h-9 rounded bg-zinc-800 flex items-center justify-center font-bold shrink-0"
              x-show="broken[r.key || r.id] || !r.key" x-text="r.name.charAt(0)"></span>

        <!-- name version runtime caps -->
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-medium truncate" x-text="r.name"></span>
            <a :href="r.website" x-show="r.website" target="_blank" rel="noopener" class="text-xs text-zinc-500 hover:text-emerald-300 shrink-0" title="plugin website">↗</a>
            <span class="text-xs text-zinc-500" x-text="r.version"></span>
            <span class="text-[10px] uppercase tracking-wide bg-zinc-800 rounded px-1.5 py-0.5"
                  x-show="r.runtime" x-text="r.runtime"></span>
          </div>
          <div class="flex gap-1 mt-1">
            <template x-for="c in caps(r)" :key="c">
              <span class="text-[10px] bg-zinc-900 border border-zinc-800 rounded px-1.5 py-0.5 text-zinc-400"
                    x-text="c"></span>
            </template>
          </div>
          <p class="text-xs text-red-400 mt-1" x-show="r.state==='error'"
             x-text="'last error: '+r.error"></p>
        </div>

        <span class="flex-1"></span>

        <!-- status -->
        <span class="text-xs shrink-0"
              :class="stateClass(r)" x-text="stateText(r)"></span>

        <!-- actions: enrichment sources are metadata-only, not toggleable -->
        <button @click="toggle(r)" x-show="!r.enrichment"
                class="px-3 py-1 text-xs rounded bg-zinc-800 hover:bg-zinc-700"
                x-text="r.enabled ? 'Disable' : 'Enable'"></button>
        <button @click="reload()" title="Rescan plugin dir"
                class="px-2 py-1 text-xs rounded bg-zinc-800 hover:bg-zinc-700">⟳</button>
      </li>
    </template>
  </ul>

<script>
function pluginsPage() {
  return {
    plugins: [], enrich: [], q: '', busy: false,
    broken: {},
    async load() {
      this.busy = true
      const j = await (await fetch('/api/plugins')).json()
      this.plugins = j.plugins || []
      this.enrich = j.enrichment || []
      this.busy = false
    },
    get view() {
      const q = this.q.trim().toLowerCase()
      if (!q) return this.plugins
      return this.plugins.filter(r =>
        r.name.toLowerCase().includes(q) || (r.caps || '').toLowerCase().includes(q))
    },
    get enrichView() {
      const q = this.q.trim().toLowerCase()
      if (!q) return this.enrich
      return this.enrich.filter(e =>
        e.name.toLowerCase().includes(q) || (e.caps || '').toLowerCase().includes(q))
    },
    caps(r) { return (r.caps || '').split(',').filter(Boolean) },
    stateText(r) { return !r.enabled ? '○ disabled' : (r.state === 'error' ? '⚠ error' : '● active') },
    stateClass(r) {
      if (!r.enabled) return 'text-zinc-500'
      return r.state === 'error' ? 'text-yellow-400' : 'text-green-400'
    },
    async toggle(r) {
      await fetch('/plugin/' + r.id + '/enabled', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled: !r.enabled })
      })
      await this.load()
    },
    async reload() {
      this.busy = true
      await fetch('/plugins/reload', { method: 'POST' })
      await this.load()
    },
  }
}
</script>
  </main>
  <div id="srv-status" style="display:none;position:fixed;top:0;left:0;right:0;z-index:50;text-align:center;font-size:12px;padding:6px 0;"></div>
  <script>
  (function () {
    const el = document.getElementById('srv-status');
    let down = false, wasDown = false;
    async function probe() {
      try {
        const r = await fetch('/health', {cache: 'no-store'});
        if (!r.ok) throw 0;
        if (wasDown) { flash('Server back online', '#065f46'); wasDown = false; }
        else el.style.display = 'none';
        down = false;
      } catch (e) {
        down = true; wasDown = true;
        el.textContent = 'Server offline — waiting for it to come back…';
        el.style.background = '#7f1d1d'; el.style.color = '#fecaca'; el.style.display = 'block';
      }
    }
    function flash(msg, bg) {
      el.textContent = msg; el.style.background = bg; el.style.color = '#d1fae5'; el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }
    window.__srvRestart = async function () {
      wasDown = true;
      try { await fetch('/admin/restart', {method: 'POST'}); } catch (e) { /* expected: connection drops */ }
      el.textContent = 'Server restarting… waiting for it to come back';
      el.style.background = '#78350f'; el.style.color = '#fde68a'; el.style.display = 'block';
      const t = setInterval(async () => {
        try {
          const r = await fetch('/health', {cache: 'no-store'});
          if (r.ok) { clearInterval(t); flash('Server back online', '#065f46'); wasDown = false; }
        } catch (e) {}
      }, 1000);
    };
    setInterval(probe, 5000);
    probe();
  })();
  </script>
</body>
</html>
