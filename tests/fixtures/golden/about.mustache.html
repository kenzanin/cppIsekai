<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>cppIsekai</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script defer src="/static/alpine.min.js"></script>
  <style>
    /* per-manga dim+blur: toggling status_flags bit6 marks this page's cover */
    img.cover-dim { filter: brightness(0.35) blur(6px); }
    .dim-toggle { font-size: 11px; }
  </style>
  <script>
    // Cover imgs carry &plugin=<p>&slug=<s>. Parse once, dim the pair, label toggles.
    const coverKey = function (img) {
      try {
        const u = new URL(img.src, location.origin);
        if (u.searchParams.get('cover') !== '1') return null;
        const plugin = u.searchParams.get('plugin');
        const slug = u.searchParams.get('slug');
        return plugin && slug ? plugin + '/' + slug : null;
      } catch (e) { return null; }
    };
    const dimSet = new Set();
    const paintDim = function () {
      document.querySelectorAll('img[src*="cover=1"]').forEach(img => {
        const k = coverKey(img);
        img.classList.toggle('cover-dim', !!k && dimSet.has(k));
      });
      document.querySelectorAll('[data-dim-toggle]').forEach(b => {
        const k = b.dataset.dimToggle;
        const on = !!k && dimSet.has(k);
        b.textContent = on ? 'Show cover' : 'Dim + blur cover';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    };
    const loadDim = async function () {
      try {
        const r = await fetch('/api/display/dim-list');
        if (!r.ok) return;
        const j = await r.json();
        (j.data || []).forEach(([p, s]) => dimSet.add(p + '/' + s));
        paintDim();
      } catch (e) { /* leave covers alone */ }
    };
    window.paintDim = paintDim; // detail page renders its cover async; it repaints after load()
    // Toggle one manga (from detail button) or a pair passed explicitly.
    window.toggleDimBlur = async function (plugin, slug) {
      plugin = plugin || (window.__dimPair && window.__dimPair[0]);
      slug = slug || (window.__dimPair && window.__dimPair[1]);
      if (!plugin || !slug) return;
      const k = plugin + '/' + slug;
      const on = !dimSet.has(k);
      try {
        const r = await fetch('/api/display/dim-blur', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ plugin, slug, on }) });
        if (!r.ok) { window.toast('error', 'dim failed'); return; }
        if (on) dimSet.add(k); else dimSet.delete(k);
        paintDim();
        window.toast('success', on ? 'Cover dimmed' : 'Cover restored');
      } catch (e) { /* leave UI unchanged */ }
    };
    document.addEventListener('DOMContentLoaded', loadDim);
    window.addEventListener('htmx:afterSwap', paintDim); // grid reloads via htmx keep their dim
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
<div id="toast-host" class="fixed bottom-4 right-4 z-50 flex flex-col items-end gap-2"></div>
<script>
(function () {
  const host = document.getElementById('toast-host');
  const KINDS = {
    success: 'bg-emerald-600 text-white',
    error: 'bg-red-600 text-white',
    info: 'bg-zinc-700 text-zinc-100'
  };
  window.toast = function (kind, msg) {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') led(document.activeElement, kind === 'success' ? 'bg-emerald-400' : kind === 'error' ? 'bg-red-400' : 'bg-amber-400', 3000);
    while (host.children.length >= 4) host.firstElementChild.remove();
    const t = document.createElement('div');
    t.className = 'px-3 py-2 rounded shadow-lg text-sm cursor-pointer max-w-xs ' + (KINDS[kind] || KINDS.info);
    t.textContent = msg;
    t.onclick = function () { t.remove(); };
    host.appendChild(t);
    setTimeout(function () { t.remove(); }, kind === 'error' ? 8000 : 5000);
    return t;
  };
  const ledClass = function (btn, color) {
    // Icon-only controls stay square: park the LED on the corner instead of
    // widening the button with an inline dot.
    return 'feedback-led w-2 h-2 rounded-full ' + color + ' ' +
      (btn.classList.contains('icon-action') ? 'absolute -top-1 -right-1 ml-0' : 'inline-block ml-2 align-middle');
  };
  const led = function (btn, color, ms) {
    if (!btn) return;
    let d = btn.querySelector(':scope > .feedback-led');
    if (!d) {
      d = document.createElement('span');
      d.className = ledClass(btn, color);
      btn.appendChild(d);
    }
    d.className = ledClass(btn, color);
    if (ms > 0) {
      clearTimeout(d._t);
      d._t = setTimeout(function () { d.remove(); }, ms);
    }
  };
  window.runFeedback = async function (job, btn) {
    if (btn) { btn.disabled = true; btn.classList.add('opacity-60'); }
    led(btn, 'bg-amber-400'); // persistent until job resolves
    let r = null;
    try {
      r = await job();
    } catch (e) {
      window.toast('error', (e && e.message) || String(e));
      led(btn, 'bg-red-400', 3000);
      if (btn) { btn.disabled = false; btn.classList.remove('opacity-60'); }
      return;
    }
    const ok = !!(r && r.ok);
    window.toast(ok ? 'success' : 'error', ok ? ((r && r.message) || 'Done') : ((r && r.error) || 'Failed'));
    led(btn, ok ? 'bg-emerald-400' : 'bg-red-400', 3000);
    if (btn) { btn.disabled = false; btn.classList.remove('opacity-60'); }
  };
})();
</script>
  <header class="flex items-center gap-1 border-b border-zinc-800 px-4 h-12">
    <a href="/" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Library</a>
    <a href="/search" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Search</a>
    <a href="/plugins" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Plugins</a>
    <a href="/settings" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Settings</a>
    <span class="flex-1"></span>
    <a href="/logs" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Logs</a>
    <a href="/about" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors bg-zinc-800">About</a>
  </header>
  <main class="p-4">
<style>
  .about-md { max-width: 52rem; margin: 0 auto; line-height: 1.7; color: #d4d4d8; }
  .about-md h1 { font-size: 1.6rem; font-weight: 700; color: #fafafa; margin-bottom: .4rem; }
  .about-md h2 { font-size: 1.2rem; font-weight: 600; color: #fafafa; margin: 1.6rem 0 .5rem; border-bottom: 1px solid #27272a; padding-bottom: .3rem; }
  .about-md h3 { font-size: 1rem; font-weight: 600; color: #e4e4e7; margin: 1.1rem 0 .4rem; }
  .about-md p, .about-md li { margin: .45rem 0; }
  .about-md ul { list-style: disc; padding-left: 1.4rem; }
  .about-md ol { list-style: decimal; padding-left: 1.4rem; }
  .about-md a { color: #93c5fd; text-decoration: underline; text-underline-offset: 2px; }
  .about-md a:hover { color: #bfdbfe; }
  .about-md code { background: #18181b; border: 1px solid #27272a; border-radius: .3rem; padding: .1rem .35rem; font-size: .85em; }
  .about-md pre { background: #18181b; border: 1px solid #27272a; border-radius: .5rem; padding: .75rem 1rem; overflow-x: auto; margin: .6rem 0; }
  .about-md pre code { background: transparent; border: 0; padding: 0; }
  .about-md table { width: 100%; border-collapse: collapse; margin: .7rem 0; font-size: .9rem; }
  .about-md th, .about-md td { border: 1px solid #27272a; padding: .35rem .6rem; text-align: left; }
  .about-md th { background: #18181b; color: #e4e4e7; }
  .about-md svg { max-width: 100%; height: auto; }
  .about-md pre.mermaid, .about-md .mermaid { background: transparent; border: 0; text-align: center; }
  .mm-wrap { position: relative; }
  .mm-bar { position: absolute; top: .25rem; right: .25rem; display: flex; gap: .25rem; opacity: .25; transition: opacity .15s; z-index: 5; }
  .mm-wrap:hover .mm-bar, .mm-wrap:focus-within .mm-bar { opacity: 1; }
  .mm-bar button { background: #18181b; border: 1px solid #27272a; color: #d4d4d8; border-radius: .3rem; padding: 0 .4rem; font-size: .8rem; line-height: 1.4; cursor: pointer; }
  .mm-bar button:hover { border-color: #52525b; color: #fafafa; }
  .mm-wrap:fullscreen { background: #09090b; padding: 2rem; display: flex; flex-direction: column; }
  .mm-wrap:fullscreen pre { flex: 1; overflow: auto; margin: 0; }
</style>

<div id="about-content" class="about-md">
  <div class="text-zinc-500 text-sm py-10 text-center">Loading README&hellip;</div>
</div>

<script src="/static/marked.min.js"></script>
<script src="/static/mermaid.min.js"></script>
<script>
(function () {
  const GH = 'https://github.com/kenzanin/cppIsekai';
  const BRANCH = 'main';
  const el = document.getElementById('about-content');

  function fail(msg) {
    el.innerHTML = '<p class="text-red-400">Failed to render README.md: ' + msg +
      ' <button id="about-retry" class="underline ml-2">Retry</button></p>';
    document.getElementById('about-retry').addEventListener('click', () => location.reload());
  }

  // Per-diagram toolbar: zoom, fullscreen, SVG/PNG export. The svg keeps its
  // natural width; zoom scales it past the column and the <pre> scrolls.
  function decorateDiagrams() {
    const dl = (href, name) => {
      const a = document.createElement('a');
      a.href = href; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    };
    document.querySelectorAll('.language-mermaid').forEach((pre, i) => {
      const svg = pre.querySelector('svg');
      if (!svg) return;
      const wrap = document.createElement('div');
      wrap.className = 'mm-wrap';
      pre.replaceWith(wrap); wrap.appendChild(pre);
      const bar = document.createElement('div');
      bar.className = 'mm-bar';
      bar.innerHTML =
        '<button title="Zoom in">+</button>' +
        '<button title="Zoom out">&minus;</button>' +
        '<button title="Reset zoom">100%</button>' +
        '<button title="Fullscreen">&#x26F6;</button>' +
        '<button title="Download SVG">SVG</button>' +
        '<button title="Download PNG">PNG</button>';
      wrap.appendChild(bar);
      const [zin, zout, zreset, fs, svgB, pngB] = bar.children;
      let scale = 1;
      const apply = () => {
        svg.style.maxWidth = 'none';
        svg.style.width = (scale * 100) + '%';
        svg.style.height = 'auto';
      };
      zin.onclick = () => { scale = Math.min(4, scale * 1.25); apply(); };
      zout.onclick = () => { scale = Math.max(.5, scale / 1.25); apply(); };
      zreset.onclick = () => { scale = 1; svg.style.maxWidth = ''; svg.style.width = ''; svg.style.height = ''; };
      fs.onclick = () => (document.fullscreenElement ? document.exitFullscreen() : wrap.requestFullscreen());
      const src = new XMLSerializer().serializeToString(svg);
      svgB.onclick = () => dl(URL.createObjectURL(new Blob([src], { type: 'image/svg+xml' })), 'diagram-' + (i + 1) + '.svg');
      pngB.onclick = () => {
        try {
          const img = new Image();
          img.onload = () => {
            const vb = svg.viewBox && svg.viewBox.baseVal;
            const w = (vb && vb.width) || img.naturalWidth, h = (vb && vb.height) || img.naturalHeight;
            const c = document.createElement('canvas'); c.width = w * 2; c.height = h * 2;
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            c.toBlob(b => b && dl(URL.createObjectURL(b), 'diagram-' + (i + 1) + '.png'), 'image/png');
          };
          img.onerror = () => {};
          img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
        } catch (err) { console.warn('png export failed', err); }
      };
    });
  }

  fetch('/about/readme', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(md => {
      el.innerHTML = marked.parse(md);

      // Repo-root relative links (e.g. `ARCHITECTURE.md`) live on GitHub, not in the app.
      el.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute('href') || '';
        if (/^(https?:|mailto:|#)/.test(href)) {
          if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
          return;
        }
        a.href = GH + '/blob/' + BRANCH + '/' + href.replace(/^\.\//, '');
        a.target = '_blank';
        a.rel = 'noopener';
      });

      mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict' });
      mermaid.run({ querySelector: '.language-mermaid' }).then(decorateDiagrams).catch(e => {
        const warn = document.createElement('p');
        warn.className = 'text-yellow-500 text-sm';
        warn.textContent = 'Diagrams failed to render: ' + (e.message || e);
        el.prepend(warn);
      });
    })
    .catch(e => fail(e.message || String(e)));
})();
</script>
  </main>
  <div id="srv-status" style="display:none;position:fixed;top:0;left:0;right:0;z-index:50;text-align:center;font-size:12px;padding:6px 0;"></div>
  <script>
  (function () {
    const el = document.getElementById('srv-status');
    let down = false, wasDown = false;
    async function probe() {
      try {
        const r = await fetch('/health', {cache: 'no-store'});
        if (!r.ok) throw 0;
        if (wasDown) { flash('Server back online', '#065f46'); wasDown = false; }
        else el.style.display = 'none';
        down = false;
      } catch (e) {
        down = true; wasDown = true;
        el.textContent = 'Server offline — waiting for it to come back…';
        el.style.background = '#7f1d1d'; el.style.color = '#fecaca'; el.style.display = 'block';
      }
    }
    function flash(msg, bg) {
      el.textContent = msg; el.style.background = bg; el.style.color = '#d1fae5'; el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }
    window.__srvRestart = async function () {
      wasDown = true;
      window.toast("info", "Restarting server...");
      try { await fetch('/admin/restart', {method: 'POST'}); } catch (e) { /* expected: connection drops */ }
      el.textContent = 'Server restarting… waiting for it to come back';
      el.style.background = '#78350f'; el.style.color = '#fde68a'; el.style.display = 'block';
      const t = setInterval(async () => {
        try {
          const r = await fetch('/health', {cache: 'no-store'});
          if (r.ok) { clearInterval(t); flash('Server back online', '#065f46'); wasDown = false; }
        } catch (e) {}
      }, 1000);
    };
    setInterval(probe, 5000);
    probe();
  })();
  </script>
</body>
</html>
