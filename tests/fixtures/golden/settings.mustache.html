<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>cppIsekai</title>
  <script src="/static/tailwind.min.js"></script>
  <script src="/static/htmx.min.js"></script>
  <script defer src="/static/alpine.min.js"></script>
  <style>
    /* dim+blur for cover images only (covers carry &cover=1); server-rendered from host/dim_blur */
    .dim-blur img[src*="cover=1"] { filter: brightness(0.35) blur(6px); }
    .dim-toggle { font-size: 11px; }
  </style>
  <script>
    const paintToggles = function (on) { document.querySelectorAll('[data-dim-toggle]').forEach(b => b.textContent = on ? 'Show covers' : 'Dim + blur covers'); };
    window.toggleDimBlur = async function () {
      const on = !document.body.classList.contains('dim-blur');
      try {
        const r = await fetch('/api/display/dim-blur', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ on }) });
        if (!r.ok) return;
        document.body.classList.toggle('dim-blur', on);
        paintToggles(on);
      } catch (e) { /* server unreachable; leave UI unchanged */ }
    };
    document.addEventListener('DOMContentLoaded', function () { paintToggles(document.body.classList.contains('dim-blur')); });
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <header class="flex items-center gap-1 border-b border-zinc-800 px-4 h-12">
    <a href="/" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Library</a>
    <a href="/search" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Search</a>
    <a href="/plugins" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Plugins</a>
    <a href="/settings" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors bg-zinc-800">Settings</a>
    <span class="flex-1"></span>
    <a href="/logs" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Logs</a>
    <a href="/about" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">About</a>
  </header>
  <main class="p-4">
<div x-data="settingsPage" x-init="boot()">
  <h1 class="text-lg font-semibold mb-3">Settings</h1>
  <p class="text-xs text-zinc-500 mb-3">Values resolve per layer: default &lt; ini &lt; <code>CPPISEKAI_*</code> env &lt; <code>--flag</code>. Rows won by env/flag are read-only. Save writes the ini in place; comments survive.</p>
  <p class="text-sm text-red-400 mb-2" x-show="err" x-text="err" x-cloak></p>
  <p class="text-sm text-zinc-500 mb-2" x-show="note" x-text="note" x-cloak></p>

  <div x-show="loading" class="text-sm text-zinc-500">…</div>

  <template x-for="section in sections()" :key="section">
    <section class="mb-5">
      <h2 class="text-xs uppercase tracking-wide text-zinc-500 mb-2" x-text="section"></h2>
      <ul class="space-y-2">
        <template x-for="k in knobs.filter(x => x.section === section)" :key="k.fullKey">
          <li class="border border-zinc-800 rounded p-3">
            <div class="flex items-center gap-2 flex-wrap">
              <code class="text-xs text-zinc-400" x-text="k.fullKey"></code>
              <span class="text-[10px] uppercase rounded px-1.5 py-0.5 bg-zinc-800 text-zinc-400" x-text="sourceOf(k)"></span>
              <span class="text-[10px] rounded px-1.5 py-0.5 bg-amber-900/40 text-amber-400" x-show="k.restart">restart to apply</span>
              <span class="text-[10px] rounded px-1.5 py-0.5 bg-emerald-900/40 text-emerald-400" x-show="k.live">applied live</span>
              <span class="flex-1"></span>
              <!-- input -->
              <template x-if="enumOf(k)">
                <select class="bg-zinc-900 border border-zinc-700 rounded px-2 py-1.5 text-sm"
                        :value="k.value" :disabled="readOnly(k)"
                        @change="dirty[k.fullKey] = $event.target.value">
                  <template x-for="opt in enumOf(k)" :key="opt">
                    <option :value="opt" :selected="opt === k.value" x-text="opt"></option>
                  </template>
                </select>
              </template>
              <template x-if="!enumOf(k) && k.type !== 'str'">
                <input type="number" min="1" step="256" class="bg-zinc-900 border border-zinc-700 rounded px-2 py-1.5 text-sm w-48"
                       :value="k.value" :disabled="readOnly(k)"
                       @input="dirty[k.fullKey] = $event.target.value">
              </template>
              <template x-if="!enumOf(k) && k.type === 'str'">
                <span class="flex items-center gap-2">
                  <template x-if="k.fullKey === 'server.proxy' && !reveal[k.fullKey]">
                    <input type="password" class="bg-zinc-900 border border-zinc-700 rounded px-2 py-1.5 text-sm w-80"
                           :value="k.value" :disabled="readOnly(k)"
                           @input="dirty[k.fullKey] = $event.target.value">
                  </template>
                  <template x-if="!(k.fullKey === 'server.proxy' && !reveal[k.fullKey])">
                    <input type="text" class="bg-zinc-900 border border-zinc-700 rounded px-2 py-1.5 text-sm w-80"
                           :value="k.value" :disabled="readOnly(k)"
                           @input="dirty[k.fullKey] = $event.target.value">
                  </template>
                  <button type="button" x-show="k.fullKey === 'server.proxy'" class="text-xs text-zinc-500 underline"
                          @click="reveal[k.fullKey] = !reveal[k.fullKey]" x-text="reveal[k.fullKey] ? 'hide' : 'show'"></button>
                </span>
              </template>
            </div>
            <p class="text-xs text-zinc-500 mt-1" x-text="k.doc"></p>
            <p class="text-xs text-amber-500/80 mt-1" x-show="readOnly(k)"
               x-text="'won by ' + sourceOf(k) + ' — editing the ini will not change this value'"></p>
          </li>
        </template>
      </ul>
    </section>
  </template>

  <div class="flex gap-2 mt-4 items-center">
    <button @click="save()" :disabled="saving || Object.keys(dirty).length === 0"
            class="px-4 py-1.5 text-sm rounded bg-zinc-100 text-zinc-900 disabled:opacity-40">Save changes</button>
    <button @click="dirty = {}" class="px-4 py-1.5 text-sm rounded bg-zinc-800 hover:bg-zinc-700">Discard edits</button>
    <span class="flex-1"></span>
    <button @click="restart()" :disabled="restarting"
            class="px-4 py-1.5 text-sm rounded bg-red-900/70 hover:bg-red-800 text-red-100 disabled:opacity-40"
            x-text="restarting ? 'Restarting…' : 'Restart server'"></button>
  </div>
</div>
<script>
function settingsPage() {
  const RESTART = new Set(['server.port', 'paths.library', 'paths.log_file', 'paths.data_dir', 'paths.templates_dir',
                           'cache.cache_max_mb', 'cache.image_format', 'cache.cover_max_px', 'log.level']);
  const LIVE = new Set(['plugin.fetch_profile']);
  // fetch_profile options come from the ini ([plugin] fetch_profiles), surfaced as
  // j.fetch_profiles; fall back to ENUMS if the server didn't send any.
  const ENUMS = { 'cache.image_format': ['webp', 'avif', 'jxl', 'none'],
                  'log.level': ['trace', 'debug', 'info', 'warning', 'error'] };
  return {
    knobs: [], fetchProfiles: [], dirty: {}, reveal: {}, loading: true, saving: false, err: '', note: '', restarting: false,
    async boot() {
      try {
        const j = await (await fetch('/config')).json();
        this.fetchProfiles = j.fetch_profiles || [];
        this.knobs = (j.knobs || []).map(k => ({
          ...k,
          fullKey: k.fullKey,
          restart: RESTART.has(k.fullKey),
          live: LIVE.has(k.fullKey),
        }));
      } catch (e) { this.err = String(e); }
      this.loading = false;
    },
    sections() { return [...new Set(this.knobs.map(k => k.section))]; },
    sourceOf(k) { return k.source; },
    enumOf(k) { return k.fullKey === 'plugin.fetch_profile' ? this.fetchProfiles : (ENUMS[k.fullKey] || null); },
    readOnly(k) { return k.source === 'env' || k.source === 'flag'; },
    patched() {
      const out = {};
      for (const [key, value] of Object.entries(this.dirty)) {
        const t = this.knobs.find(k => k.fullKey === key);
        if (t && t.type !== 'str') {
          const n = Number(value);
          if (Number.isFinite(n)) out[key] = n; else out[key] = value; // server is the validator
        } else out[key] = value;
      }
      return out;
    },
    async restart() {
      if (!confirm('Restart server sekarang? Koneksi akan putus sebentar.')) return;
      this.restarting = true;
      if (window.__srvRestart) await window.__srvRestart();
    },
    async save() {
      this.saving = true; this.err = ''; this.note = '';
      try {
        const r = await fetch('/config', { method: 'POST', headers: {'Content-Type': 'application/json'},
                                           body: JSON.stringify(this.patched()) });
        const j = await r.json();
        if (!j.ok) { this.err = j.error || ('HTTP ' + r.status); }
        else { this.note = 'saved (' + j.written + ' key(s) written)'; this.dirty = {}; await this.boot(); }
      } catch (e) { this.err = String(e); }
      this.saving = false;
    },
  };
}
</script>
  </main>
  <div id="srv-status" style="display:none;position:fixed;top:0;left:0;right:0;z-index:50;text-align:center;font-size:12px;padding:6px 0;"></div>
  <script>
  (function () {
    const el = document.getElementById('srv-status');
    let down = false, wasDown = false;
    async function probe() {
      try {
        const r = await fetch('/health', {cache: 'no-store'});
        if (!r.ok) throw 0;
        if (wasDown) { flash('Server back online', '#065f46'); wasDown = false; }
        else el.style.display = 'none';
        down = false;
      } catch (e) {
        down = true; wasDown = true;
        el.textContent = 'Server offline — waiting for it to come back…';
        el.style.background = '#7f1d1d'; el.style.color = '#fecaca'; el.style.display = 'block';
      }
    }
    function flash(msg, bg) {
      el.textContent = msg; el.style.background = bg; el.style.color = '#d1fae5'; el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }
    window.__srvRestart = async function () {
      wasDown = true;
      try { await fetch('/admin/restart', {method: 'POST'}); } catch (e) { /* expected: connection drops */ }
      el.textContent = 'Server restarting… waiting for it to come back';
      el.style.background = '#78350f'; el.style.color = '#fde68a'; el.style.display = 'block';
      const t = setInterval(async () => {
        try {
          const r = await fetch('/health', {cache: 'no-store'});
          if (r.ok) { clearInterval(t); flash('Server back online', '#065f46'); wasDown = false; }
        } catch (e) {}
      }, 1000);
    };
    setInterval(probe, 5000);
    probe();
  })();
  </script>
</body>
</html>
