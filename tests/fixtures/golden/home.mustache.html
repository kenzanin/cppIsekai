<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>cppIsekai</title>
  <script src="/static/tailwind.min.js"></script>
  <script src="/static/htmx.min.js"></script>
  <script defer src="/static/alpine.min.js"></script>
  <style>
    /* per-manga dim+blur: toggling host/dim/<plugin>/<slug> marks this page's cover */
    img.cover-dim { filter: brightness(0.35) blur(6px); }
    .dim-toggle { font-size: 11px; }
  </style>
  <script>
    // Cover imgs carry &plugin=<p>&slug=<s>. Parse once, dim the pair, label toggles.
    const coverKey = function (img) {
      try {
        const u = new URL(img.src, location.origin);
        if (u.searchParams.get('cover') !== '1') return null;
        const plugin = u.searchParams.get('plugin');
        const slug = u.searchParams.get('slug');
        return plugin && slug ? plugin + '/' + slug : null;
      } catch (e) { return null; }
    };
    const dimSet = new Set();
    const paintDim = function () {
      document.querySelectorAll('img[src*="cover=1"]').forEach(img => {
        const k = coverKey(img);
        img.classList.toggle('cover-dim', !!k && dimSet.has(k));
      });
      document.querySelectorAll('[data-dim-toggle]').forEach(b => {
        const k = b.dataset.dimToggle;
        const on = !!k && dimSet.has(k);
        b.textContent = on ? 'Show cover' : 'Dim + blur cover';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    };
    const loadDim = async function () {
      try {
        const r = await fetch('/api/display/dim-list');
        if (!r.ok) return;
        const j = await r.json();
        (j.data || []).forEach(([p, s]) => dimSet.add(p + '/' + s));
        paintDim();
      } catch (e) { /* leave covers alone */ }
    };
    window.paintDim = paintDim; // detail page renders its cover async; it repaints after load()
    // Toggle one manga (from detail button) or a pair passed explicitly.
    window.toggleDimBlur = async function (plugin, slug) {
      plugin = plugin || (window.__dimPair && window.__dimPair[0]);
      slug = slug || (window.__dimPair && window.__dimPair[1]);
      if (!plugin || !slug) return;
      const k = plugin + '/' + slug;
      const on = !dimSet.has(k);
      try {
        const r = await fetch('/api/display/dim-blur', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ plugin, slug, on }) });
        if (!r.ok) return;
        if (on) dimSet.add(k); else dimSet.delete(k);
        paintDim();
      } catch (e) { /* leave UI unchanged */ }
    };
    document.addEventListener('DOMContentLoaded', loadDim);
    window.addEventListener('htmx:afterSwap', paintDim); // grid reloads via htmx keep their dim
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <header class="flex items-center gap-1 border-b border-zinc-800 px-4 h-12">
    <a href="/" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors bg-zinc-800">Library</a>
    <a href="/search" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Search</a>
    <a href="/plugins" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Plugins</a>
    <a href="/settings" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Settings</a>
    <span class="flex-1"></span>
    <a href="/logs" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Logs</a>
    <a href="/about" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">About</a>
  </header>
  <main class="p-4">
  <div class="flex gap-6">
    <aside class="w-52 shrink-0 space-y-4">
      <button onclick="window.dispatchEvent(new CustomEvent('grid:reset'))"
              class="block w-full text-left px-3 py-2 rounded border border-zinc-700 bg-zinc-900 hover:bg-zinc-800">
        <span class="block text-lg font-semibold text-zinc-100"></span>
        <span class="block text-xs text-zinc-500">titles · reset filters</span>
      </button>
      <button onclick="window.dispatchEvent(new CustomEvent('grid:toggle-dup'))"
              class="block w-full text-left px-3 py-2 rounded border border-zinc-700 bg-zinc-900 hover:bg-zinc-800">
        <span class="block text-lg font-semibold text-zinc-100"></span>
        <span class="block text-xs text-zinc-500">duplicates · filter clusters</span>
      </button>
      <nav class="space-y-1">
        <a href="/" data-grid-plugin="" class="block px-2 py-1 rounded bg-zinc-800"
           onclick="event.preventDefault();window.dispatchEvent(new CustomEvent('grid:plugin',{detail:''}))"
           >All plugins</a>
        <a href="/?plugin="
           data-grid-plugin=""
           class="flex justify-between px-2 py-1 rounded bg-zinc-800"
           onclick="event.preventDefault();window.dispatchEvent(new CustomEvent('grid:plugin',{detail:''}))"
           >
          <span class="flex items-center gap-1.5">
            <img src="/plugin/mangadex/logo" alt="" class="w-4 h-4 rounded-sm">
            <span>mangadex</span>
          </span>
          <span class="text-zinc-500">2</span>
        </a>
        <a href="/?plugin="
           data-grid-plugin=""
           class="flex justify-between px-2 py-1 rounded "
           onclick="event.preventDefault();window.dispatchEvent(new CustomEvent('grid:plugin',{detail:''}))"
           >
          <span class="flex items-center gap-1.5">
            
            <span>baka</span>
          </span>
          <span class="text-zinc-500">0</span>
        </a>
      </nav>

    </aside>
    <section class="flex-1 space-y-4">
      <form action="/" method="get" class="flex gap-2"
            hx-get="/library/grid" hx-target="#grid" hx-push-url="true">
        
        <input name="q" value="" placeholder="Search library"
               class="focus:outline-none focus:ring-2 focus:ring-zinc-500 focus:border-transparent transition flex-1 bg-zinc-900 border border-zinc-700 rounded px-3 py-1.5">
      </form>
      <div id="grid">
        <div x-data="gridPage">
        <script>
        function gridPage() {
          return {
            q: '', plugin: '', sort: 'added', filters: [], page: 1, perPage: 12,
            pages: 1, count: 0, total: 0, hasDup: false, hasStats: false,
            init() {
              this.rescan();
              const p = new URLSearchParams(location.search).get('plugin');
              if (p) this.plugin = p;
              window.addEventListener('grid:reset', () => this.reset());
              window.addEventListener('grid:plugin', (e) => { this.plugin = e.detail || ''; this.page = 1; this.apply(); });
              window.addEventListener('grid:toggle-dup', () => this.toggleFilter('dup'));
              document.body.addEventListener('htmx:afterSwap', () => { this.rescan(); this.apply(); });
              this.apply();
            },
            syncSidebar() { document.querySelectorAll('[data-grid-plugin]').forEach(el => el.classList.toggle('bg-zinc-800', (el.dataset.gridPlugin || '') === this.plugin)); },
            rescan() {
              this.cards = typeof document !== 'undefined'
                ? Array.from(document.querySelectorAll('#saved-cards > li'))
                : [];
              this.total = this.cards.length;
              this.hasDup = this.cards.some(c => (+c.dataset.dup || 0) > 0);
              this.hasStats = this.cards.some(c => (+c.dataset.total || 0) > 0);
            },
            toggleFilter(f) {
              const i = this.filters.indexOf(f);
              if (i < 0) {
                this.filters.push(f);
                if (f === 'dup') this.sort = 'dup'; // auto-engage cluster order (library-dedup spec)
              } else {
                this.filters.splice(i, 1);
                if (f === 'dup') this.sort = 'added';
              }
              this.page = 1; this.apply();
            },
            setPlugin(p) { this.plugin = (this.plugin === p ? '' : p); this.page = 1; this.apply(); },
            setSort(s) { this.sort = s; this.page = 1; this.apply(); },
            reset() { this.q = ''; this.plugin = ''; this.sort = 'added'; this.filters = []; this.page = 1; this.apply(); },
            ratio(c) { const t = +c.dataset.total || 0; return t > 0 ? (+c.dataset.read || 0) / t : -1; },
            matches(c) {
              if (this.plugin && c.dataset.plugin !== this.plugin) return false;
              const q = this.q.trim().toLowerCase();
              if (q && !c.dataset.name.toLowerCase().includes(q)) return false;
              if (this.filters.includes('dup') && !((+c.dataset.dup || 0) > 0)) return false;
              if (this.filters.includes('new') && !((+c.dataset.update || 0) > 0)) return false;
              if (this.filters.includes('done') && !((+c.dataset.total || 0) > 0 && (+c.dataset.read || 0) >= (+c.dataset.total || 0))) return false;
              if (this.filters.includes('complete') && (c.dataset.status || '').toLowerCase() !== 'completed') return false;
              return true;
            },
            apply() {
              const ul = document.getElementById('saved-cards');
              if (!ul) return;
              let vis = this.cards.filter(c => this.matches(c));
              if (this.sort === 'title') vis.sort((a, b) => a.dataset.name.localeCompare(b.dataset.name));
              else if (this.sort === 'progress') vis.sort((a, b) => this.ratio(b) - this.ratio(a));
              else if (this.sort === 'read') vis.sort((a, b) => (+b.dataset.lastread || 0) - (+a.dataset.lastread || 0));
              else if (this.sort === 'update') vis.sort((a, b) => (+b.dataset.updated || 0) - (+a.dataset.updated || 0));
              else if (this.sort === 'dup') vis.sort((a, b) => {
                const da = +a.dataset.dup || 0, db = +b.dataset.dup || 0;
                return (da === 0) - (db === 0) || da - db || a.dataset.name.localeCompare(b.dataset.name);
              });
              else vis.sort((a, b) => (+b.dataset.added || 0) - (+a.dataset.added || 0)); // 'added'
              this.count = vis.length;
              const pages = Math.max(1, Math.ceil(vis.length / this.perPage));
              this.pages = pages;
              if (this.page > pages) this.page = pages;
              for (const c of vis) ul.appendChild(c);
              const start = (this.page - 1) * this.perPage, end = this.page * this.perPage;
              const shown = new Set(vis.slice(start, end));
              for (const c of this.cards) c.style.display = shown.has(c) ? '' : 'none';
              this.syncSidebar();
            },
          };
        }
        </script>
        <div class="flex flex-wrap items-center gap-2 mb-3">
          <button x-show="hasDup" @click="toggleFilter('dup')" class="px-2.5 py-1 text-xs rounded-full border" :class="filters.includes('dup') ? 'border-violet-500 bg-violet-900/40 text-violet-300' : 'border-zinc-700 text-zinc-400 hover:bg-zinc-800'">Duplicates</button>
          <button x-show="hasStats" @click="toggleFilter('new')" class="px-2.5 py-1 text-xs rounded-full border" :class="filters.includes('new') ? 'border-red-500 bg-red-900/40 text-red-300' : 'border-zinc-700 text-zinc-400 hover:bg-zinc-800'">New</button>
          <button x-show="hasStats" @click="toggleFilter('done')" class="px-2.5 py-1 text-xs rounded-full border" :class="filters.includes('done') ? 'border-emerald-500 bg-emerald-900/40 text-emerald-300' : 'border-zinc-700 text-zinc-400 hover:bg-zinc-800'">Done</button>
          <button x-show="hasStats" @click="toggleFilter('complete')" class="px-2.5 py-1 text-xs rounded-full border" :class="filters.includes('complete') ? 'border-green-500 bg-green-900/40 text-green-300' : 'border-zinc-700 text-zinc-400 hover:bg-zinc-800'">Complete</button>
          <select x-model="sort" @change="apply()" class="text-xs bg-zinc-900 border border-zinc-700 rounded px-2 py-1 text-zinc-300">
            <option value="added">Sort: recently added</option>
            <option value="title">Sort: title</option>
            <option value="progress">Sort: progress</option>
            <option value="read">Sort: recent read</option>
            <option value="update">Sort: recent update</option>
            <option value="dup" x-show="hasDup">Sort: duplicate group</option>
          </select>
          <button @click="reset()" class="px-2.5 py-1 text-xs rounded-full border border-zinc-700 text-zinc-400 hover:bg-zinc-800">Reset</button>
          <span class="text-xs text-zinc-500" x-text="count + ' / ' + total + ' shown'"></span>
        </div>
        <div x-show="count === 0 && total > 0" class="py-16 text-center text-zinc-500 text-sm">
          No manga matches
          <button @click="reset()" class="underline underline-offset-2 hover:text-zinc-300">Reset filters</button>
        </div>
        <ul id="saved-cards" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                  <li data-name="One Piece" data-plugin="mangadex" data-status="" data-total="" data-read="" data-update="" data-added="" data-lastread="" data-updated="" data-dup="3">
            <a href="&#x2F;view&#x2F;manga&#x2F;mangadex&#x2F;one-piece" class="group block min-w-0">
              <div class="relative">
                  <img src="/cache/img?url=http:&#x2F;&#x2F;example&#x2F;cover.jpg&cover=1&plugin=mangadex&slug=one-piece"
                       class="w-full aspect-[2/3] object-cover rounded-lg border border-zinc-800 transition duration-150 group-hover:border-zinc-700" alt="One Piece" loading="lazy"
                       onerror="this.style.display='none';this.parentNode.querySelector('[data-fallback]').style.display='flex'">
                <div class="aspect-[2/3] w-full rounded-lg flex items-center justify-center text-center text-2xl text-zinc-400 bg-zinc-800" data-fallback
                     style="display:none;">One Piece</div>
                <div class="absolute left-2 top-2 flex items-center gap-1">
                  <span x-show="(+$el.closest('li').dataset.update) > 0" class="rounded bg-red-600/70 px-2 py-0.5 text-[12px] font-semibold uppercase tracking-wide text-white">New</span>
                  <span x-show="!((+$el.closest('li').dataset.update) > 0) && (+$el.closest('li').dataset.total || 0) > 0 && (+$el.closest('li').dataset.read || 0) >= (+$el.closest('li').dataset.total || 0)" class="rounded bg-emerald-600/70 px-2 py-0.5 text-[12px] font-semibold uppercase tracking-wide text-white">Done</span>
                  <span x-show="$el.closest('li').dataset.status" class="rounded bg-black/40 px-2 py-0.5 text-[12px] font-medium uppercase tracking-wide text-zinc-100" x-text="$el.closest('li').dataset.status"></span>
                </div>
                <button class="absolute left-2 bottom-2 rounded bg-black/40 px-2 py-0.5 text-[12px] text-zinc-100 hover:bg-black/60 flex items-center gap-1.5" @click.prevent="setPlugin('mangadex')"><img src="/plugin/mangadex/logo" alt="" class="w-5 h-5 rounded-sm" onerror="this.style.display='none'">mangadex</button>
              </div>
              <p class="mt-1 text-sm truncate text-zinc-300 group-hover:text-zinc-100 transition-colors">One Piece</p>
              <p class="text-xs text-zinc-500" x-show="(+$el.closest('li').dataset.total || 0) > 0"><span x-text="$el.closest('li').dataset.read"></span> / <span x-text="$el.closest('li').dataset.total"></span> read</p>
            </a>
          </li>
                  <li data-name="No Cover" data-plugin="baka" data-status="" data-total="" data-read="" data-update="" data-added="" data-lastread="" data-updated="" data-dup="0">
            <a href="&#x2F;view&#x2F;manga&#x2F;baka&#x2F;no-cover" class="group block min-w-0">
              <div class="relative">
                  <img src="/cache/img?url=&cover=1&plugin=baka&slug=no-cover"
                       class="w-full aspect-[2/3] object-cover rounded-lg border border-zinc-800 transition duration-150 group-hover:border-zinc-700" alt="No Cover" loading="lazy"
                       onerror="this.style.display='none';this.parentNode.querySelector('[data-fallback]').style.display='flex'">
                <div class="aspect-[2/3] w-full rounded-lg flex items-center justify-center text-center text-2xl text-zinc-400 bg-zinc-800" data-fallback
                     style="display:none;">No Cover</div>
                <div class="absolute left-2 top-2 flex items-center gap-1">
                  <span x-show="(+$el.closest('li').dataset.update) > 0" class="rounded bg-red-600/70 px-2 py-0.5 text-[12px] font-semibold uppercase tracking-wide text-white">New</span>
                  <span x-show="!((+$el.closest('li').dataset.update) > 0) && (+$el.closest('li').dataset.total || 0) > 0 && (+$el.closest('li').dataset.read || 0) >= (+$el.closest('li').dataset.total || 0)" class="rounded bg-emerald-600/70 px-2 py-0.5 text-[12px] font-semibold uppercase tracking-wide text-white">Done</span>
                  <span x-show="$el.closest('li').dataset.status" class="rounded bg-black/40 px-2 py-0.5 text-[12px] font-medium uppercase tracking-wide text-zinc-100" x-text="$el.closest('li').dataset.status"></span>
                </div>
                <button class="absolute left-2 bottom-2 rounded bg-black/40 px-2 py-0.5 text-[12px] text-zinc-100 hover:bg-black/60 flex items-center gap-1.5" @click.prevent="setPlugin('baka')"><img src="/plugin/baka/logo" alt="" class="w-5 h-5 rounded-sm" onerror="this.style.display='none'">baka</button>
              </div>
              <p class="mt-1 text-sm truncate text-zinc-300 group-hover:text-zinc-100 transition-colors">No Cover</p>
              <p class="text-xs text-zinc-500" x-show="(+$el.closest('li').dataset.total || 0) > 0"><span x-text="$el.closest('li').dataset.read"></span> / <span x-text="$el.closest('li').dataset.total"></span> read</p>
            </a>
          </li>
        </ul>
        <div class="flex justify-end mt-4" x-show="count > 0 && pages > 1" x-cloak>
          <nav class="flex gap-1 items-center text-sm text-zinc-400">
            <button @click="page = Math.max(1, page - 1); apply()" :disabled="page <= 1" class="px-2 py-1 rounded bg-zinc-800 hover:bg-zinc-700 disabled:opacity-30">‹</button>
            <template x-for="n in Array.from({length: pages}, (_, i) => i + 1)" :key="n">
              <button @click="page = n; apply()" class="px-2 py-1 rounded" :class="n === page ? 'bg-zinc-700 text-zinc-100' : 'bg-zinc-800 hover:bg-zinc-700'" x-text="n"></button>
            </template>
            <button @click="page = Math.min(pages, page + 1); apply()" :disabled="page >= pages" class="px-2 py-1 rounded bg-zinc-800 hover:bg-zinc-700 disabled:opacity-30">›</button>
          </nav>
        </div>
        </div>
              </div>
    </section>
  </div>
  </main>
  <div id="srv-status" style="display:none;position:fixed;top:0;left:0;right:0;z-index:50;text-align:center;font-size:12px;padding:6px 0;"></div>
  <script>
  (function () {
    const el = document.getElementById('srv-status');
    let down = false, wasDown = false;
    async function probe() {
      try {
        const r = await fetch('/health', {cache: 'no-store'});
        if (!r.ok) throw 0;
        if (wasDown) { flash('Server back online', '#065f46'); wasDown = false; }
        else el.style.display = 'none';
        down = false;
      } catch (e) {
        down = true; wasDown = true;
        el.textContent = 'Server offline — waiting for it to come back…';
        el.style.background = '#7f1d1d'; el.style.color = '#fecaca'; el.style.display = 'block';
      }
    }
    function flash(msg, bg) {
      el.textContent = msg; el.style.background = bg; el.style.color = '#d1fae5'; el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }
    window.__srvRestart = async function () {
      wasDown = true;
      try { await fetch('/admin/restart', {method: 'POST'}); } catch (e) { /* expected: connection drops */ }
      el.textContent = 'Server restarting… waiting for it to come back';
      el.style.background = '#78350f'; el.style.color = '#fde68a'; el.style.display = 'block';
      const t = setInterval(async () => {
        try {
          const r = await fetch('/health', {cache: 'no-store'});
          if (r.ok) { clearInterval(t); flash('Server back online', '#065f46'); wasDown = false; }
        } catch (e) {}
      }, 1000);
    };
    setInterval(probe, 5000);
    probe();
  })();
  </script>
</body>
</html>
