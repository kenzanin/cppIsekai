<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cppIsekai — reader</title>
  <script src="/static/tailwind.min.js"></script>
  <script defer src="/static/alpine.min.js"></script>
  <style>[x-cloak]{display:none !important}</style>
</head>
<body class="bg-black text-zinc-100 h-screen overflow-y-auto">
<div id="toast-host" class="fixed bottom-4 right-4 z-50 flex flex-col items-end gap-2"></div>
<script>
(function () {
  const host = document.getElementById('toast-host');
  const KINDS = {
    success: 'bg-emerald-600 text-white',
    error: 'bg-red-600 text-white',
    info: 'bg-zinc-700 text-zinc-100'
  };
  window.toast = function (kind, msg) {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') led(document.activeElement, kind === 'success' ? 'bg-emerald-400' : kind === 'error' ? 'bg-red-400' : 'bg-amber-400', 3000);
    while (host.children.length >= 4) host.firstElementChild.remove();
    const t = document.createElement('div');
    t.className = 'px-3 py-2 rounded shadow-lg text-sm cursor-pointer max-w-xs ' + (KINDS[kind] || KINDS.info);
    t.textContent = msg;
    t.onclick = function () { t.remove(); };
    host.appendChild(t);
    setTimeout(function () { t.remove(); }, kind === 'error' ? 8000 : 5000);
    return t;
  };
  const led = function (btn, color, ms) {
    if (!btn) return;
    let d = btn.querySelector(':scope > .feedback-led');
    if (!d) {
      d = document.createElement('span');
      d.className = 'feedback-led inline-block w-2 h-2 rounded-full ml-2 align-middle';
      btn.appendChild(d);
    }
    d.className = 'feedback-led inline-block w-2 h-2 rounded-full ml-2 align-middle ' + color;
    if (ms > 0) {
      clearTimeout(d._t);
      d._t = setTimeout(function () { d.remove(); }, ms);
    }
  };
  window.runFeedback = async function (job, btn) {
    if (btn) { btn.disabled = true; btn.classList.add('opacity-60'); }
    led(btn, 'bg-amber-400'); // persistent until job resolves
    let r = null;
    try {
      r = await job();
    } catch (e) {
      window.toast('error', (e && e.message) || String(e));
      led(btn, 'bg-red-400', 3000);
      if (btn) { btn.disabled = false; btn.classList.remove('opacity-60'); }
      return;
    }
    const ok = !!(r && r.ok);
    window.toast(ok ? 'success' : 'error', ok ? ((r && r.message) || 'Done') : ((r && r.error) || 'Failed'));
    led(btn, ok ? 'bg-emerald-400' : 'bg-red-400', 3000);
    if (btn) { btn.disabled = false; btn.classList.remove('opacity-60'); }
  };
})();
</script>
<main class="min-h-screen">

<div x-data="readerPage" x-init="boot()" @keydown.window="keys($event)" @scroll.window="track()" @wheel.window.passive="wheel($event)"
     class="relative" :dir="dir">

  <p class="text-sm text-red-400 py-2" x-show="err" x-text="err"></p>
  <p class="text-sm text-zinc-500 py-8" x-show="!err && !pages.length">Loading&#8230;</p>

  <!-- done overlay: last chapter finished -->
  <div x-show="done" x-cloak
       class="fixed inset-0 z-40 flex flex-col items-center justify-center gap-4 bg-black/90">
    <p class="text-4xl font-bold">Done &#127881;</p>
    <a :href="'/view/manga/'+encodeURIComponent(plugin)+'/'+encodeURIComponent(slug)"
       class="px-4 py-2 rounded border border-zinc-600 text-zinc-100 hover:bg-zinc-800">Back to detail</a>
  </div>

  <!-- dim page indicator (hidden while nav shown) -->
  <div x-show="!navShown && !done && pages.length" x-cloak
       class="fixed bottom-3 inset-x-0 z-10 text-center text-xs tabular-nums text-zinc-500 opacity-60 pointer-events-none"
       x-text="label()"></div>

  <!-- tap zones (paged/spread only); center third toggles nav, sides page -->
  <div class="fixed top-0 bottom-0 left-0 w-1/3 z-10" x-show="mode !== 'webtoon' && !done"
       @click="step(dir === 'rtl' ? 1 : -1)"></div>
  <div class="fixed top-0 bottom-0 left-1/3 w-1/3 z-10" x-show="!done"
       @click="navShown = !navShown"></div>
  <div class="fixed top-0 bottom-0 right-0 w-1/3 z-10" x-show="mode !== 'webtoon' && !done"
       @click="step(dir === 'rtl' ? -1 : 1)"></div>

  <div :class="shellClass()" data-shell>
    <template x-for="(view, vi) in views" :key="vi">
      <div x-show="mode === 'webtoon' || vi === cur()" :class="viewClass()" :data-vi="vi" :style="{zoom: zoomPct / 100}">
        <template x-for="u in view" :key="u">
          <img :src="loaded(vi) ? u : spacer" :class="imgClass()" alt="" draggable="false">
        </template>
      </div>
    </template>
  </div>
  <!-- top overlay: mode/dir/zoom + chapter dropdown (synced) + exit-to-detail. Shown only while navShown. -->
  <div x-show="navShown && !done" x-cloak
       class="fixed top-0 inset-x-0 z-30 flex items-center justify-between gap-2 px-3 py-2 bg-zinc-950/95 border-b border-zinc-800 backdrop-blur">
    <!-- Left group: [view mode] [zoom] [ltr/rtl] -->
    <div class="flex items-center gap-2 shrink-0">
      <select x-model="mode" @change="modeChanged()" aria-label="Reading mode"
              class="bg-zinc-900 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-zinc-200 focus:outline-none focus:border-zinc-500">
        <option value="webtoon">webtoon</option>
        <option value="paged">paged</option>
        <option value="spread-h">spread h</option>
        <option value="spread-v">spread v</option>
      </select>
      <div class="flex items-center gap-1" role="group" aria-label="Image zoom">
        <button @click="zoomOut()" :disabled="zoom === 'custom' && zoomPct <= 25" aria-label="Zoom out"
                class="w-7 h-7 rounded border border-zinc-700 bg-zinc-900 text-sm leading-none text-zinc-100 hover:bg-zinc-800 disabled:opacity-30">&#8722;</button>
        <select x-model="zoom" @change="zoomPresetChanged()" aria-label="Zoom preset"
                class="bg-zinc-900 border border-zinc-700 rounded px-2 py-1.5 text-xs text-zinc-200 focus:outline-none focus:border-zinc-500">
          <option value="fit-w">fit W</option>
          <option value="fit-h">fit H</option>
          <option value="1:1">1:1</option>
          <option value="custom" x-text="zoom === 'custom' ? zoomPct + '%' : 'custom'"></option>
        </select>
        <button @click="zoomIn()" :disabled="zoom === 'custom' && zoomPct >= 400" aria-label="Zoom in"
                class="w-7 h-7 rounded border border-zinc-700 bg-zinc-900 text-sm leading-none text-zinc-100 hover:bg-zinc-800 disabled:opacity-30">+</button>
      </div>
      <select x-model="dir" x-show="mode !== 'webtoon'" @change="persist()" aria-label="Direction"
              class="bg-zinc-900 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-zinc-200 focus:outline-none focus:border-zinc-500">
        <option value="ltr">ltr</option>
        <option value="rtl">rtl</option>
      </select>
    </div>
  
    <!-- Right group: [chapter select with capped title] + page count -->
    <div class="flex items-center gap-2 min-w-0 max-w-[50vw] justify-end">
      <span class="text-xs text-zinc-400 tabular-nums shrink-0 hidden sm:inline" x-text="label()"></span>
      <select :value="chId" @change="gotoChapter($event.target.value)" aria-label="Chapter"
              class="bg-zinc-900 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-zinc-200 truncate max-w-full focus:outline-none focus:border-zinc-500">
        <template x-for="c in chaptersList" :key="c.id">
          <option :value="c.id" :selected="String(c.id) === String(chId)"
                  x-text="formatChapterLabel(c)"></option>
        </template>
      </select>
      <!-- Exit to detail: extreme top-right corner -->
      <a :href="'/view/manga/'+encodeURIComponent(plugin)+'/'+encodeURIComponent(slug)"
         class="flex items-center gap-1.5 shrink-0 px-2.5 py-1.5 rounded border border-zinc-700 bg-zinc-900/80 text-zinc-100 hover:bg-zinc-800 transition-colors" aria-label="Back to detail">
        <span class="text-xs font-medium hidden sm:inline">Detail</span>
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4"/><path d="M10 12H3.5"/><path d="M13.5 8L17.5 12 13.5 16"/></svg>
      </a>
    </div>
  </div>
  <!-- bottom overlay: page list only. Shown only while navShown. -->
  <div x-show="navShown && !done" x-cloak
       class="fixed bottom-0 inset-x-0 z-30 bg-zinc-950/90 border-t border-zinc-800 backdrop-blur">
    <template x-if="pages.length <= 24">
      <div class="flex gap-1 flex-wrap justify-center px-2 py-2">
        <template x-for="n in pages.length" :key="n">
          <button @click="goto_page(n)"
                  :class="n === page ? 'bg-zinc-100 text-zinc-900 border-zinc-100' : 'text-zinc-300 border-zinc-700 hover:bg-zinc-800'"
                  class="w-10 h-10 text-base leading-none font-medium tabular-nums rounded border"
                  x-text="n"></button>
        </template>
      </div>
    </template>
    <template x-if="pages.length > 24">
      <div class="flex justify-center px-2 py-2">
        <select :value="page" @change="goto_page(Number($event.target.value))" aria-label="Page"
                class="bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:border-zinc-500">
          <template x-for="n in pages.length" :key="n">
            <option :value="n" :selected="n === page" x-text="'p ' + n + ' / ' + pages.length"></option>
          </template>
        </select>
      </div>
    </template>
  </div>
</div>

<script>window.RESUME={ch:'12',page:'3',mode:'paged',dir:'rtl',zoom:'fit-width'};</script>
<script src="/static/reader.js"></script>
</main>
  <div id="srv-status" style="display:none;position:fixed;top:0;left:0;right:0;z-index:50;text-align:center;font-size:12px;padding:6px 0;"></div>
  <script>
  (function () {
    const el = document.getElementById('srv-status');
    let down = false, wasDown = false;
    async function probe() {
      try {
        const r = await fetch('/health', {cache: 'no-store'});
        if (!r.ok) throw 0;
        if (wasDown) { flash('Server back online', '#065f46'); wasDown = false; }
        else el.style.display = 'none';
        down = false;
      } catch (e) {
        down = true; wasDown = true;
        el.textContent = 'Server offline — waiting for it to come back…';
        el.style.background = '#7f1d1d'; el.style.color = '#fecaca'; el.style.display = 'block';
      }
    }
    function flash(msg, bg) {
      el.textContent = msg; el.style.background = bg; el.style.color = '#d1fae5'; el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }
    window.__srvRestart = async function () {
      wasDown = true;
      window.toast("info", "Restarting server...");
      try { await fetch('/admin/restart', {method: 'POST'}); } catch (e) { /* expected: connection drops */ }
      el.textContent = 'Server restarting… waiting for it to come back';
      el.style.background = '#78350f'; el.style.color = '#fde68a'; el.style.display = 'block';
      const t = setInterval(async () => {
        try {
          const r = await fetch('/health', {cache: 'no-store'});
          if (r.ok) { clearInterval(t); flash('Server back online', '#065f46'); wasDown = false; }
        } catch (e) {}
      }, 1000);
    };
    setInterval(probe, 5000);
    probe();
  })();
  </script>
</body>
</html>
