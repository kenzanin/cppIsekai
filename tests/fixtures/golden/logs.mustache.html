<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>cppIsekai</title>
  <script src="/static/tailwind.min.js"></script>
  <script src="/static/htmx.min.js"></script>
  <script defer src="/static/alpine.min.js"></script>
  <style>
    /* per-manga dim+blur: toggling status_flags bit6 marks this page's cover */
    img.cover-dim { filter: brightness(0.35) blur(6px); }
    .dim-toggle { font-size: 11px; }
  </style>
  <script>
    // Cover imgs carry &plugin=<p>&slug=<s>. Parse once, dim the pair, label toggles.
    const coverKey = function (img) {
      try {
        const u = new URL(img.src, location.origin);
        if (u.searchParams.get('cover') !== '1') return null;
        const plugin = u.searchParams.get('plugin');
        const slug = u.searchParams.get('slug');
        return plugin && slug ? plugin + '/' + slug : null;
      } catch (e) { return null; }
    };
    const dimSet = new Set();
    const paintDim = function () {
      document.querySelectorAll('img[src*="cover=1"]').forEach(img => {
        const k = coverKey(img);
        img.classList.toggle('cover-dim', !!k && dimSet.has(k));
      });
      document.querySelectorAll('[data-dim-toggle]').forEach(b => {
        const k = b.dataset.dimToggle;
        const on = !!k && dimSet.has(k);
        b.textContent = on ? 'Show cover' : 'Dim + blur cover';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    };
    const loadDim = async function () {
      try {
        const r = await fetch('/api/display/dim-list');
        if (!r.ok) return;
        const j = await r.json();
        (j.data || []).forEach(([p, s]) => dimSet.add(p + '/' + s));
        paintDim();
      } catch (e) { /* leave covers alone */ }
    };
    window.paintDim = paintDim; // detail page renders its cover async; it repaints after load()
    // Toggle one manga (from detail button) or a pair passed explicitly.
    window.toggleDimBlur = async function (plugin, slug) {
      plugin = plugin || (window.__dimPair && window.__dimPair[0]);
      slug = slug || (window.__dimPair && window.__dimPair[1]);
      if (!plugin || !slug) return;
      const k = plugin + '/' + slug;
      const on = !dimSet.has(k);
      try {
        const r = await fetch('/api/display/dim-blur', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ plugin, slug, on }) });
        if (!r.ok) return;
        if (on) dimSet.add(k); else dimSet.delete(k);
        paintDim();
      } catch (e) { /* leave UI unchanged */ }
    };
    document.addEventListener('DOMContentLoaded', loadDim);
    window.addEventListener('htmx:afterSwap', paintDim); // grid reloads via htmx keep their dim
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <header class="flex items-center gap-1 border-b border-zinc-800 px-4 h-12">
    <a href="/" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Library</a>
    <a href="/search" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Search</a>
    <a href="/plugins" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Plugins</a>
    <a href="/settings" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">Settings</a>
    <span class="flex-1"></span>
    <a href="/logs" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors bg-zinc-800">Logs</a>
    <a href="/about" class="px-3 py-1 rounded hover:bg-zinc-800/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500 transition-colors ">About</a>
  </header>
  <main class="p-4">
  <pre id="log" class="bg-zinc-900 rounded p-3 text-xs leading-5 h-[70vh] overflow-auto"
       x-data x-init="const ws=new WebSocket(`ws://${location.host}/ws/log`); ws.onmessage=e=>{$el.textContent+=e.data; $el.scrollTop=$el.scrollHeight}">first log line
second log line
</pre>
  </main>
  <div id="srv-status" style="display:none;position:fixed;top:0;left:0;right:0;z-index:50;text-align:center;font-size:12px;padding:6px 0;"></div>
  <script>
  (function () {
    const el = document.getElementById('srv-status');
    let down = false, wasDown = false;
    async function probe() {
      try {
        const r = await fetch('/health', {cache: 'no-store'});
        if (!r.ok) throw 0;
        if (wasDown) { flash('Server back online', '#065f46'); wasDown = false; }
        else el.style.display = 'none';
        down = false;
      } catch (e) {
        down = true; wasDown = true;
        el.textContent = 'Server offline — waiting for it to come back…';
        el.style.background = '#7f1d1d'; el.style.color = '#fecaca'; el.style.display = 'block';
      }
    }
    function flash(msg, bg) {
      el.textContent = msg; el.style.background = bg; el.style.color = '#d1fae5'; el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }
    window.__srvRestart = async function () {
      wasDown = true;
      try { await fetch('/admin/restart', {method: 'POST'}); } catch (e) { /* expected: connection drops */ }
      el.textContent = 'Server restarting… waiting for it to come back';
      el.style.background = '#78350f'; el.style.color = '#fde68a'; el.style.display = 'block';
      const t = setInterval(async () => {
        try {
          const r = await fetch('/health', {cache: 'no-store'});
          if (r.ok) { clearInterval(t); flash('Server back online', '#065f46'); wasDown = false; }
        } catch (e) {}
      }, 1000);
    };
    setInterval(probe, 5000);
    probe();
  })();
  </script>
</body>
</html>
